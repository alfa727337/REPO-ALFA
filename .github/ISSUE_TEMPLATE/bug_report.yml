name: Bug report
description: Report a reproducible REPO ALFA defect
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not include passwords, tokens, cookies or private data."
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: "0.2.0 or commit SHA"
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Linux, Windows, macOS, Docker, Other]
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command
      description: Redact private target details when necessary.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
    validations:
      required: true

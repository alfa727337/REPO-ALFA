[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "repo-alfa"
version = "0.1.0"
description = "Advanced Web Reverse Engineering, Deep Analysis, Reconstruction and Resilient Capture Framework"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.5",
  "rich>=13.9",
  "httpx>=0.27.2",
  "beautifulsoup4>=4.12.3",
  "lxml>=5.3.0",
  "playwright>=1.48.0",
  "pydantic>=2.9.2",
  "networkx>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.7", "mypy>=1.13"]

[project.scripts]
repo-alfa = "repo_alfa.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["repo_alfa"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
